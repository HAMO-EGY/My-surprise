
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACK LUXURY</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: #f5f0e6;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

.gold {
  color: #d6b56d;
}

section {
  padding: 80px 20px;
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#intro {
  min-height: 100vh;
  background: radial-gradient(circle, #242016, #080808 65%);
}

h1 {
  font-size: clamp(32px, 8vw, 65px);
  letter-spacing: 3px;
  margin: 20px;
}

h2 {
  color: #d6b56d;
  margin-bottom: 25px;
  font-size: 30px;
}

p {
  color: #c9c2b5;
  line-height: 2;
  max-width: 650px;
  font-size: 18px;
}

button {
  background: #d6b56d;
  color: #111;
  border: none;
  padding: 15px 35px;
  margin-top: 30px;
  cursor: pointer;
  font-weight: bold;
  letter-spacing: 2px;
  border-radius: 3px;
}

button:hover {
  background: #f2d99e;
}

.hidden {
  display: none !important;
}

.line {
  width: 70px;
  height: 2px;
  background: #d6b56d;
  margin: 25px auto;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(130px, 230px));
  gap: 18px;
  margin-top: 30px;
}

.photo {
  height: 220px;
  border: 1px solid #8c7040;
  background: linear-gradient(145deg, #211d15, #0d0d0d);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a58a54;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.letter {
  border: 1px solid #705a32;
  padding: 35px 25px;
  max-width: 650px;
  background: #101010;
  margin-top: 20px;
}

#timer {
  font-size: 30px;
  color: #d6b56d;
  margin-top: 25px;
  direction: ltr;
}

footer {
  padding: 30px;
  color: #756b58;
  border-top: 1px solid #292319;
}

.star {
  position: fixed;
  color: #d6b56d;
  animation: fall linear infinite;
  pointer-events: none;
  z-index: 5;
}

@keyframes fall {
  from { transform: translateY(-20px); opacity: 0; }
  20% { opacity: 1; }
  to { transform: translateY(100vh); opacity: 0; }
}

@media (max-width: 450px) {
  .gallery {
    grid-template-columns: repeat(2, minmax(110px, 1fr));
  }
  .photo {
    height: 170px;
  }
}
</style>
</head>

<body>

<section id="intro">
  <p class="gold">A MOMENT MADE FOR YOU</p>
  <h1 id="mainTitle">BLACK LUXURY</h1>
  <div class="line"></div>
  <button onclick="startExperience()">ENTER THE EXPERIENCE</button>
</section>

<main id="experience" class="hidden">

  <section>
    <p class="gold">A SPECIAL MESSAGE FOR</p>
    <h1 id="personName"></h1>
    <div class="line"></div>
    <p id="welcomeText"></p>
  </section>

  <section>
    <h2>OUR MOMENTS</h2>
    <p>Some memories deserve to stay forever.</p>
    <div class="gallery" id="gallery"></div>
  </section>

  <section>
    <h2>A LETTER FOR YOU</h2>
    <div class="letter">
      <p id="letterText"></p>
    </div>
  </section>

  <section>
    <h2>EVERY MOMENT COUNTS</h2>
    <p>Counting from the special date...</p>
    <div id="timer">Loading...</div>
  </section>

  <section>
    <h2>ONE LAST THING</h2>
    <p class="gold">This experience was made especially for you.</p>
    <button onclick="toggleMusic()">PLAY MUSIC ♫</button>
  </section>

</main>

<footer>
  MADE WITH LOVE 🖤
</footer>

<audio id="music" loop></audio>

<script src="customize.js"></script>

<script>
document.getElementById("mainTitle").textContent = settings.title;
document.getElementById("personName").textContent = settings.name;
document.getElementById("welcomeText").textContent = settings.welcome;
document.getElementById("letterText").textContent = settings.letter;

const gallery = document.getElementById("gallery");

settings.photos.forEach((photo) => {
  const box = document.createElement("div");
  box.className = "photo";

  if (photo) {
    const img = document.createElement("img");
    img.src = photo;
    img.alt = "Memory";
    box.appendChild(img);
  } else {
    box.textContent = "YOUR PHOTO HERE";
  }

  gallery.appendChild(box);
});

const music = document.getElementById("music");
music.src = settings.music;

function startExperience() {
  document.getElementById("intro").classList.add("hidden");
  document.getElementById("experience").classList.remove("hidden");
  window.scrollTo(0, 0);
}

function toggleMusic() {
  if (music.paused) {
    music.play();
  } else {
    music.pause();
  }
}

function updateTimer() {
  const target = new Date(settings.date);
  const now = new Date();
  const difference = now - target;

  if (isNaN(target.getTime())) {
    document.getElementById("timer").textContent = "Set a valid date";
    return;
  }

  if (difference < 0) {
    document.getElementById("timer").textContent = "The date is coming...";
    return;
  }

  const days = Math.floor(difference / 86400000);
  const hours = Math.floor(difference / 3600000) % 24;
  const minutes = Math.floor(difference / 60000) % 60;
  const seconds = Math.floor(difference / 1000) % 60;

  document.getElementById("timer").textContent =
    `${days} Days | ${hours} Hours | ${minutes} Minutes | ${seconds} Seconds`;
}

setInterval(updateTimer, 1000);
updateTimer();

function createStar() {
  const star = document.createElement("div");
  star.className = "star";
  star.textContent = "✦";
  star.style.left = Math.random() * 100 + "vw";
  star.style.animationDuration = (3 + Math.random() * 5) + "s";
  document.body.appendChild(star);

  setTimeout(() => star.remove(), 8000);
}

setInterval(createStar, 500);
</script>

</body>
</html>
